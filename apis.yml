name: Cabletron Systems
description: 'Cabletron Systems, Inc. was an American manufacturer of networking and
  network-management equipment, founded in 1983 by Craig Benson and Robert Levine and
  headquartered in Rochester, New Hampshire. It rose to prominence in the 10BASE5 and
  Ethernet switching markets, shipped the ST-500 transceiver and the LAN-MD field test
  set, built the SPECTRUM network-management platform, and passed one billion US dollars
  in annual sales in 1996 at a peak of roughly 6,600 employees. In 2000 the company
  announced a split into four businesses: Enterasys Networks (enterprise switching),
  Riverstone Networks (metro service provider), Aprisma Management Technologies (SPECTRUM
  software), and GlobalNetwork Technology Services. The Cabletron holding company merged
  into Enterasys, which went public in 2001, was taken private by The Gores Group in
  2006, and was acquired by Extreme Networks in 2013. Riverstone was acquired by Lucent
  and later liquidated. Cabletron Systems no longer operates as an independent company
  and publishes no developer program, API, or documentation: the cabletron.com and
  enterasys.com domains both redirect to extremenetworks.com. This record is retained
  as a historical company profile only.'
